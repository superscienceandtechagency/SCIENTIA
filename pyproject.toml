[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scientia"
version = "0.1.0"
description = "A research-oriented system for scientific literature analysis."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pypdf>=6.20,<7",
]

[project.scripts]
scientia = "scientia.cli:main"

[dependency-groups]
demo = ["streamlit>=1.45,<2"]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
